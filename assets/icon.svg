      <rect x="0" y="0" width="208" height="272" rx="28" fill="#FFFFFF"/>
      <rect x="28" y="32" width="152" height="20" rx="10" fill="#26304C"/>
      <rect x="28" y="76" width="112" height="16" rx="8" fill="#B9C3D6"/>
